<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="text-align: center;">Heading</h1>
    <!--Block level Element - div,pre,p,h1-h6-->
    <div>Hello</div>
    <div>Hi</div>
    <p>Hello</p>
    <p>hi </p>
    <!-- Inline level Elements - span,a,sub,img,u,sup-->
    <span>Hello Everyone</span>
    <span>Hi</span>
    <p >This is <span style="color:red">Wonderful</span> and beautiful.</p>

    
</body>
</html>
