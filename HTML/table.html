<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>
</head>
<body>
    <table border="1" style="width: 90%;">
        <caption  style="text-align: center;caption-side: bottom;">IPL Players</caption>
        <!--1st row-->
        <tr>
            <th>Sl/no</th>
            <th>Name</th>
            <th>team</th>
        </tr>
        <!--2nd row-->
        <tr>
            <td>1</td>
            <td>M.S.Dhoni</td>
            <td>CSK</td>
        </tr>
        <!--3rd row-->
        <tr>
            <td>2</td>
            <td>Virat Kohli</td>
            <td>RCB</td>
        </tr>
         <!--4th row-->
         <tr>
            <td>3</td>
            <td>Rohit Sharma</td>
            <td>MI</td>
        </tr>
            <!--5th row-->
            <tr>
                <td>4</td>
                <td>Ravindra Jadeja</td>
                <td>CSK</td>
    </table>
    
</body>
</html>
